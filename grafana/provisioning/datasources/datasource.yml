apiVersion: 1

datasources:
  - name: Delhi-Postgres
    uid: delhi-postgres
    type: postgres
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: root
    jsonData:
      database: delhi_aq
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false

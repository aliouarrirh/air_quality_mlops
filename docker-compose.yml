services:
  postgres:
    image: postgres:15
    container_name: aq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: delhi_aq
    ports:
      - "4901:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
    networks:
      - air_quality_net

  db-init:
    image: postgres:15
    container_name: aq_db_init
    depends_on:
      postgres:
        condition: service_healthy
    command: psql -h postgres -U postgres -d delhi_aq -f /init.sql
    volumes:
      - ./database/init.sql:/init.sql
    environment:
      PGPASSWORD: root
    networks:
      - air_quality_net
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: aq_mlflow
    ports:
      - "4902:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mldata/mlflow.db
      --default-artifact-root file:///mldata/mlruns
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - ./ml:/mldata
    networks:
      - air_quality_net
    restart: unless-stopped

  dagster-webserver:
    build: .
    container_name: aq_dagster_webserver
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w dagster_pipeline/workspace.yaml
    ports:
      - "4903:3000"
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - .:/app
    depends_on:
      - postgres
      - mlflow
    networks:
      - air_quality_net
    restart: unless-stopped

  dagster-daemon:
    build: .
    container_name: aq_dagster_daemon
    command: dagster-daemon run -w dagster_pipeline/workspace.yaml
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DAGSTER_HOME: /app/dagster_home
    volumes:
      - .:/app
    depends_on:
      - postgres
      - mlflow
    networks:
      - air_quality_net
    restart: unless-stopped

  api:
    build: .
    container_name: aq_api
    ports:
      - "4904:8000"
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_URI: models:/m-61fad1d7817d4ac291d401e107371bcf
    depends_on:
      - mlflow
    networks:
      - air_quality_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: aq_grafana
    ports:
      - "4905:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres
    networks:
      - air_quality_net
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:

networks:
  air_quality_net:
    driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: aq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: delhi_aq
    ports:
      - "4901:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
    networks:
      - air_quality_net

  db-init:
    image: postgres:15
    container_name: aq_db_init
    depends_on:
      postgres:
        condition: service_healthy
    command: psql -h postgres -U postgres -d delhi_aq -f /init.sql
    volumes:
      - ./database/init.sql:/init.sql
    environment:
      PGPASSWORD: root
    networks:
      - air_quality_net
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: aq_minio
    # Le port S3 (9000) reste interne au reseau docker : seuls mlflow y accede.
    # Seule la console web est exposee, pour pouvoir montrer les artefacts.
    ports:
      - "4906:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - air_quality_net
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: aq_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mlflow &&
      echo '[minio-init] bucket mlflow pret'
      "
    networks:
      - air_quality_net
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: aq_mlflow
    ports:
      - "4902:5000"
    # --serve-artifacts : le serveur relaie les artefacts vers MinIO.
    # Les clients (dagster, api) utilisent des URI mlflow-artifacts:/ et
    # n'ont donc besoin ni de boto3 ni des identifiants S3.
    command: >
      sh -c "pip install --no-cache-dir boto3 -q &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mldata/mlflow.db
      --serve-artifacts
      --artifacts-destination s3://mlflow"
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "*"
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio:
        condition: service_healthy
    # Montages conserves : les runs anterieurs a MinIO referencent encore
    # des chemins fichier (/mldata et /mlruns). Ne pas retirer.
    volumes:
      - ./ml:/mldata
      - ./ml/mlruns:/mlruns
    networks:
      - air_quality_net
    restart: unless-stopped

  dagster-webserver:
    build: .
    container_name: aq_dagster_webserver
    command: sh /app/scripts/start_dagster.sh dagster-webserver -h 0.0.0.0 -p 3000 -w dagster_pipeline/workspace.yaml
    ports:
      - "4903:3000"
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./ml:/mldata
      - ./ml/mlruns:/mlruns
    depends_on:
      - postgres
      - mlflow
    networks:
      - air_quality_net
    restart: unless-stopped

  dagster-daemon:
    build: .
    container_name: aq_dagster_daemon
    command: sh /app/scripts/start_dagster.sh dagster-daemon run -w dagster_pipeline/workspace.yaml
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DAGSTER_HOME: /app/dagster_home
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./ml:/mldata
      - ./ml/mlruns:/mlruns
    depends_on:
      - postgres
      - mlflow
    networks:
      - air_quality_net
    restart: unless-stopped

  api:
    build: .
    container_name: aq_api
    ports:
      - "4904:8000"
    env_file: .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/app
      - ./ml:/mldata
      - ./ml/mlruns:/mlruns
    depends_on:
      - mlflow
    networks:
      - air_quality_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: aq_grafana
    ports:
      - "4905:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres
    networks:
      - air_quality_net
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  minio_data:

networks:
  air_quality_net:
    driver: bridge
